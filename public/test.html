<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test SNF Plus Widget</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { color: #0047AB; }
        p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simulación Web SNF+</h1>
        <p>Esta es una página de prueba para verificar que el Widget de IA se integra correctamente y puede responder preguntas usando el manual RAG.</p>
        <p>Mira en la esquina inferior derecha... 😉</p>
    </div>

    <!--
        Atributos disponibles:
          data-api-url         → URL base del backend (auto-detectada si se omite)
          data-brand-id        → Perfil del asistente (usuario / rrhh / gestor)
          data-app-url         → URL de la aplicación en este entorno
          data-env-label       → Nombre mostrado en la cabecera del widget
          data-mediador        → Mediador de seguros de este cliente
          data-mediador-email  → Su email de contacto
          data-mediador-tel    → Su teléfono
    -->
    <script
        src="https://jepco-engine-production.up.railway.app/public/snfplus-widget.js"
        data-brand-id="snfplus_usuario"
        data-app-url="https://app.snfplus.com"
        data-env-label="SNF+"
        data-mediador="Correduría Ejemplo S.L."
        data-mediador-email="consultas@ejemplo.es"
        data-mediador-tel="+34 911 234 567">
    </script>
</body>
</html>
