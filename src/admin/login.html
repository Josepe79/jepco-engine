<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso · Jepco Engine</title>
<style>
  :root{
    --ground:#FBFCFD; --surface:#FFF; --alt:#F4F6F9;
    --ink:#10151C; --soft:#39424E; --muted:#5C6672;
    --rule:#DFE4EA; --accent:#0047AB;
    --crit:#B3261E; --crit-bg:#FBEDEC;
    --sans:system-ui,"Segoe UI Variable Text","Segoe UI",-apple-system,Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0D1117; --surface:#141A22; --alt:#1A212B;
    --ink:#E4E9EF; --soft:#C2CAD4; --muted:#8A94A0;
    --rule:#262E39; --accent:#77A9F2;
    --crit:#F09189; --crit-bg:#2C1917;
  }}
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;-webkit-font-smoothing:antialiased}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
        width:100%;max-width:370px;padding:32px}
  .eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;
           text-transform:uppercase;color:var(--accent);margin:0 0 6px}
  h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:-.015em;font-weight:650}
  .sub{font-size:.85rem;color:var(--muted);margin:0 0 24px;line-height:1.5}
  label{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;
        text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}
  .field{margin-bottom:16px}
  input{width:100%;padding:9px 11px;font-size:.95rem;font-family:var(--sans);
        background:var(--ground);color:var(--ink);
        border:1px solid var(--rule);border-radius:3px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  button{width:100%;padding:10px;font-size:.92rem;font-family:var(--sans);font-weight:600;
         background:var(--accent);color:#fff;border:0;border-radius:3px;cursor:pointer;
         margin-top:4px}
  button:hover{opacity:.92}
  .error{background:var(--crit-bg);color:var(--crit);padding:10px 12px;border-radius:3px;
         font-size:.85rem;margin-bottom:18px}
  .foot{margin-top:22px;padding-top:16px;border-top:1px solid var(--rule);
        font-size:.75rem;color:var(--muted);line-height:1.55}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">Jepco Engine</p>
    <h1>Panel de análisis</h1>
    <p class="sub">Acceso restringido. Las consultas quedan registradas con tu nombre de cuenta.</p>

    __ERROR__

    <form method="POST" action="/admin/login">
      <div class="field">
        <label for="u">Usuario</label>
        <input id="u" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="p">Contraseña</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Entrar</button>
    </form>

    <p class="foot">
      ¿Sin cuenta? Se generan con <code>node scratch/admin-user.js &lt;usuario&gt;</code>
      y se añaden a la variable <code>ADMIN_USERS</code>.
    </p>
  </div>
</body>
</html>
